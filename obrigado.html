<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensagem Enviada | Emerson Campos</title>
  <style>
    body {
      background: #0a0a0c;
      color: #fff;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 500px;
      padding: 40px;
    }
    .check {
      font-size: 80px;
      color: #00ff99;
    }
    h1 {
      font-size: 2rem;
      margin: 20px 0;
    }
    p {
      color: #b0b0b8;
      margin-bottom: 30px;
    }
    .btn {
      background: #00ff99;
      color: #000;
      padding: 12px 28px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
    }
    .btn:hover {
      background: #00cc7a;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="check">✓</div>
    <h1>Mensagem Enviada!</h1>
    <p>Obrigado pelo contato! Responderei em breve.</p>
    <a href="/" class="btn">Voltar ao portfólio</a>
  </div>
</body>
</html>
